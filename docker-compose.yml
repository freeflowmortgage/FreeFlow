version: '3.8'

services:
  # 1. Underwriting Interactive QA Console (Vite frontend with custom middleware proxy)
  underwriting-console:
    build:
      context: .
      dockerfile: apps/underwriting-console/Dockerfile
    container_name: freeflow-underwriting-console
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DOC_PARSER_URL: http://income-parser:8080
      APPRAISAL_PARSER_URL: http://appraisal-parser:8081
    depends_on:
      - income-parser
      - appraisal-parser
    restart: unless-stopped
    networks:
      - freeflow-network

  # 2. Underwriter Portal (Next.js Application)
  underwriter-portal:
    build:
      context: .
      dockerfile: apps/underwriter-portal/Dockerfile
    container_name: freeflow-underwriter-portal
    ports:
      - "3001:3001"
    environment:
      FREEFLOW_RUNTIME_ENV: development
      PORT: 3001
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://postgres:localpassword123@postgres:5432/freeflow_dev?schema=public
      DOC_PARSER_URL: http://income-parser:8080/api/underwrite/process
      DOC_PARSER_SERVICE_URL: http://income-parser:8080/parse
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      income-parser:
        condition: service_started
    restart: unless-stopped
    networks:
      - freeflow-network

  # 3. Stateless income-document parser. This service does not accept appraisal packages.
  income-parser:
    build:
      context: ./services/doc-parser
      dockerfile: Dockerfile
    container_name: freeflow-income-parser
    ports:
      - "8080:8080"
    tmpfs:
      - /tmp:size=512m,mode=1770
    restart: unless-stopped
    networks:
      - freeflow-network

  # 4. Independent collateral parser and appraisal rules boundary.
  appraisal-parser:
    build:
      context: ./services/appraisal-parser
      dockerfile: Dockerfile
    container_name: freeflow-appraisal-parser
    ports:
      - "8081:8081"
    tmpfs:
      - /tmp/appraisal_scratch:size=512m,mode=1770
    environment:
      APPRAISAL_SCRATCH_DIR: /tmp/appraisal_scratch
    restart: unless-stopped
    networks:
      - freeflow-network

  # 5. Multi-Tenant PostgreSQL Database [cite: 19, 23]
  postgres:
    image: postgres:16-alpine
    container_name: freeflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword123
      POSTGRES_DB: freeflow_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d # Optional init scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freeflow_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - freeflow-network

  # 6. Redis Cache & Fallback Queue Service [cite: 84]
  redis:
    image: redis:7-alpine
    container_name: freeflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - freeflow-network

  # 7. Local S3 Object Storage (MinIO) for eFolder File Emulation [cite: 58]
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: freeflow-minio
    ports:
      - "9000:9000"       # API port [cite: 58]
      - "9001:9001"       # Console UI port
    environment:
      MINIO_ROOT_USER: localminioadmin
      MINIO_ROOT_PASSWORD: localminiopassword123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - freeflow-network

networks:
  freeflow-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
