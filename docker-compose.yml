version: '3.8'

services:
  # 1. Multi-Tenant PostgreSQL Database [cite: 19, 23]
  postgres:
    image: postgres:16-alpine
    container_name: freeflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword123
      POSTGRES_DB: freeflow_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d # Optional init scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freeflow_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - freeflow-network

  # 2. Redis Cache & Fallback Queue Service [cite: 84]
  redis:
    image: redis:7-alpine
    container_name: freeflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - freeflow-network

  # 3. Local S3 Object Storage (MinIO) for eFolder File Emulation [cite: 58]
  minio:
    image: minio/minio:RELEASE.2024-01-28T22-40-50Z
    container_name: freeflow-minio
    ports:
      - "9000:9000"       # API port [cite: 58]
      - "9001:9001"       # Console UI port
    environment:
      MINIO_ROOT_USER: localminioadmin
      MINIO_ROOT_PASSWORD: localminiopassword123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - freeflow-network

networks:
  freeflow-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
