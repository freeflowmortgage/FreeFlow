name: Portal validation

on:
  pull_request:
    paths:
      - 'apps/underwriter-portal/**'
      - 'packages/database/**'
      - 'packages/encompass-connector-contract/**'
      - 'packages/mortgage-engine/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/portal-validation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/underwriter-portal/**'
      - 'packages/database/**'
      - 'packages/encompass-connector-contract/**'
      - 'packages/mortgage-engine/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/portal-validation.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build deployable portal
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace packages used by the portal
        run: |
          pnpm --filter @mortgage-pos/database prisma:generate
          pnpm --filter @mortgage-pos/mortgage-engine build
          pnpm --filter @mortgage-pos/encompass-connector-contract build
          pnpm --filter @mortgage-pos/encompass-connector-contract test

      - name: Verify portal API and security regression tests
        run: pnpm --filter web test

      - name: Build the production portal artifact
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm --filter web build
