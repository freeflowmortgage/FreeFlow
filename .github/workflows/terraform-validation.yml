name: Terraform validation

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-validation.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'
      - '.github/workflows/terraform-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.1

      - name: Check formatting
        run: terraform fmt -check -recursive infrastructure/terraform

      - name: Validate bootstrap
        working-directory: infrastructure/terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate dev live-test stack
        working-directory: infrastructure/terraform/environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate
