name: Database validation

on:
  pull_request:
    paths:
      - 'apps/underwriter-portal/**'
      - 'packages/database/**'
      - 'services/encompass-connector/**'
      - '.github/workflows/database-validation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/underwriter-portal/**'
      - 'packages/database/**'
      - 'services/encompass-connector/**'
      - '.github/workflows/database-validation.yml'

permissions:
  contents: read

jobs:
  migrate-and-isolate:
    name: Migrate from zero and verify isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: freeflow_validation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-validation-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d freeflow_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres-validation-only@localhost:5432/freeflow_validation
      MIGRATOR_DATABASE_URL: postgresql://freeflow_migrator_ci:migrator-validation-only@localhost:5432/freeflow_validation
      APP_DATABASE_URL: postgresql://freeflow_app_ci:app-validation-only@localhost:5432/freeflow_validation
      WORKER_DATABASE_URL: postgresql://freeflow_worker_ci:worker-validation-only@localhost:5432/freeflow_validation

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9.12.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Bootstrap database capability roles
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/prisma/bootstrap/roles.sql
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 \
            --set=migrator_username=freeflow_migrator_ci \
            --set=migrator_password=migrator-validation-only \
            --set=app_username=freeflow_app_ci \
            --set=app_password=app-validation-only \
            --set=connector_username=freeflow_worker_ci \
            --set=connector_password=worker-validation-only \
            --file=packages/database/prisma/bootstrap/logins.sql

      - name: Apply every migration through the migrator login
        env:
          DATABASE_URL: ${{ env.MIGRATOR_DATABASE_URL }}
        run: pnpm --dir packages/database exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Generate Prisma client for application-role tests
        run: pnpm --dir packages/database exec prisma generate --schema prisma/schema.prisma

      - name: Verify SQL RLS, immutable audit, and retention controls
        run: psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/prisma/tests/tenant-rls-isolation.sql

      - name: Verify connector binding migration and worker grants
        run: psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/prisma/tests/encompass-connector-bindings.sql

      - name: Verify outbound webhook grants, triggers, and dispatch isolation
        run: psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/database/prisma/tests/outbound-webhooks.sql

      - name: Verify Prisma application-role isolation
        env:
          DATABASE_URL: ${{ env.APP_DATABASE_URL }}
        run: pnpm --dir apps/underwriter-portal exec tsx --test src/server/database/*.integration.test.ts

      - name: Verify Prisma worker-role connector binding isolation
        env:
          DATABASE_URL: ${{ env.WORKER_DATABASE_URL }}
        run: pnpm --filter @mortgage-pos/encompass-connector test:database-bindings
