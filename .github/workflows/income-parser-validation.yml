name: Income parser and console validation

# main reached a state where `tsc -b` failed on the console and one jest suite
# failed on the mortgage engine, and neither showed up in CI because no
# workflow built either one. The Vite dev server does not typecheck, so a break
# like that only surfaces in a production build. This job covers the income
# path end to end: the Python parser, the engine it feeds, and the console that
# renders the result.

on:
  pull_request:
    paths:
      - 'services/doc-parser/**'
      - 'apps/underwriting-console/**'
      - 'packages/mortgage-engine/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/income-parser-validation.yml'
  push:
    branches: [main]
    paths:
      - 'services/doc-parser/**'
      - 'apps/underwriting-console/**'
      - 'packages/mortgage-engine/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/income-parser-validation.yml'

permissions:
  contents: read

concurrency:
  group: income-parser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parser:
    name: Parse, extract, and zero-retention tests
    runs-on: ubuntu-latest
    # OCR runs on CPU and the suite rasterizes several synthetic documents.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Matches services/doc-parser/Dockerfile.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/doc-parser/requirements-dev.txt

      - name: Install parser dependencies
        working-directory: services/doc-parser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Install strace for the zero-retention audit
        # The retention test traces real syscalls, because PDFium and ONNX
        # Runtime are C extensions that never pass through CPython's file
        # layer. Without strace that test skips and the guarantee goes
        # unverified.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace

      - name: Run parser tests
        working-directory: services/doc-parser
        env:
          # Set in code as well; pinned here so a CI-only regression is caught.
          ORT_DISABLE_TELEMETRY: '1'
        run: python -m pytest tests -q

      - name: Fail if the parse path wrote anything to disk
        working-directory: services/doc-parser
        run: python -m pytest tests/test_paystub_zero_retention.py -q --no-header

  console:
    name: Typecheck and build the console
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 9.12.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the income engine
        run: |
          pnpm --filter @mortgage-pos/mortgage-engine build
          pnpm --filter @mortgage-pos/mortgage-engine test

      - name: Typecheck the console
        # `pnpm --filter underwriting-console build` runs tsc then vite. Split
        # so a type error and a bundling failure are told apart in the log.
        run: pnpm --filter underwriting-console exec tsc -b

      - name: Build the production console artifact
        run: pnpm --filter underwriting-console exec vite build
