# ======================================================================
# FREEFLOW MORTGAGE SOLUTIONS - ENTERPRISE SECURITY CONFLICT SHIELD
# ======================================================================
# Highly Secure, CISO-Approved Nginx Reverse Proxy Configuration
# Purpose: Isolates and secures the standalone AI Income Engine 
# (app.freeflowmortgagesolutions.com) from arbitrary web traffic, 
# enforces hard rate-limits on high-compute OCR endpoints, and restricts
# iframe embedding strictly to authorized Encompass/POS origins.
# ======================================================================

# 1. High-Compute Rate Limiting Zone Setup
# Protects against brute-force attacks on high-compute OCR slicing and
# dynamic billing transaction generation to prevent API fee runaways.
# - Limit binary upload zone to 10 requests per minute (1r/6s) with burst buffers.
limit_req_zone $binary_remote_addr zone=ocr_processing_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general_api_limit:10m rate=5r/s;

# 2. Institutional B2B Server Block (app.freeflowmortgagesolutions.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.freeflowmortgagesolutions.com;

    # SSL Certificates (Provisioned securely via Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/app.freeflowmortgagesolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.freeflowmortgagesolutions.com/privkey.pem;
    
    # Secure SSL Protocols and Ciphers (Strict Banking Standards)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    
    # SSL Session Optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Perfect Forward Secrecy DH Parameters
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # Strict Security Headers (Enforced globally)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 3. Secure Content Security Policy (CSP) & Iframe Protection
    # Restricts framing strictly to authorized origins:
    # - Your Broker POS domain: https://*.freeflowmortgage.com
    # - Encompass-hosted custom tool views
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https://*.stripe.com;
        connect-src 'self' https://api.stripe.com https://*.supabase.co;
        frame-src 'self' https://js.stripe.com;
        frame-ancestors 'self' https://*.freeflowmortgage.com https://*.encompassform.com;
    " always;

    # Remove Server Signature for security obfuscation
    server_tokens off;

    # Max File Upload size (configured for massive 100MB tax packages)
    client_max_body_size 100M;

    # 4. Location Blocks & Reverse Proxy Routing

    # Root Routing: Serve the standalone React/Next.js Underwriting Dashboard Console
    location / {
        proxy_pass http://localhost:3000; # Local Next.js Node server
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Location Zone: High-Compute Document Processing Route
    # Route: /api/underwrite/process
    # Implements strict rate-limiting, timeout buffers for long-running OCR extractions,
    # and locks down requests to POST actions.
    location /api/underwrite/process {
        # Limit access strictly to POST methods (documents cannot be fetched via GET)
        limit_except POST {
            deny all;
        }

        # Apply strict rate-limiting (Maximum 10 file processing cycles per minute per IP)
        limit_req zone=ocr_processing_limit burst=3 nodelay;
        limit_req_status 429;

        # Keep-Alive and Extraction Timeout Buffers (Prevent 504 Gateway Timeouts during massive 100-page parses)
        proxy_read_timeout 180s;
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;

        # Standard Proxy Headers forwarding true client info to our audit ledger
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Location Zone: General Backend REST APIs
    location /api/ {
        limit_req zone=general_api_limit burst=10;
        limit_req_status 429;

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Native Hard-Purged Microservice Proxy (Python Parser Layer)
    # The containerized local FastAPI/Flask microservice that runs the ephemerally binarized python-slicing rules.
    # It lives entirely in the private loopback interface (localhost) and is NEVER exposed directly to the public web.
    # Access is mediated 100% through the authenticated Next.js API route controller.
    location /internal-engine/ {
        # Restrict access exclusively to local container network requests
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:8000/; # Internal Python loopback port
        proxy_read_timeout 120s;
    }

    # Error Pages
    error_page 429 /error-429.html;
    location = /error-429.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 504 /error-504.html;
    location = /error-504.html {
        root /usr/share/nginx/html;
        internal;
    }
}
